<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 930" width="1280" height="930" role="img" aria-label="Agent Coop 需求与配置流程：从自然语言到合格节点">
  <defs>
    <pattern id="grid3" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1B2130" stroke-width="1"/>
    </pattern>
    <marker id="arw3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A90"/>
    </marker>
    <marker id="arw3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0A83C"/>
    </marker>
    <marker id="arw3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E05A6B"/>
    </marker>
    <marker id="arw3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4CB782"/>
    </marker>
  </defs>

  <rect width="1280" height="930" fill="#0F1219"/>
  <rect width="1280" height="930" fill="url(#grid3)"/>

  <text x="40" y="54" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="27" font-weight="700" fill="#E8ECF3">需求与配置流程：从自然语言到合格节点</text>
  <text x="40" y="82" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14.5" fill="#98A2B3">结构化输入可跳过自然语言解析，但不能绕过必要评审；两个 gate 串行可同时适用，全部通过后才 apply</text>

  <!-- 主链与串行 gate -->
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
    <!-- 1 -->
    <rect x="40" y="100" width="620" height="54" rx="10" fill="#171C26" stroke="#2C3542"/>
    <rect x="40" y="100" width="4" height="54" rx="2" fill="#920783"/>
    <circle cx="76" cy="127" r="14" fill="#3A1236" stroke="#7A2A6E"/>
    <text x="76" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E5B8E8">1</text>
    <text x="102" y="122" font-size="15" font-weight="700" fill="#E8ECF3">用户需求 / 结构化配置</text>
    <text x="102" y="142" font-size="12.5" fill="#98A2B3">保留原始输入、提出者、项目与授权范围；模型生成的解释不算用户原话</text>

    <!-- 2 -->
    <rect x="40" y="172" width="620" height="54" rx="10" fill="#171C26" stroke="#2C3542"/>
    <rect x="40" y="172" width="4" height="54" rx="2" fill="#920783"/>
    <circle cx="76" cy="199" r="14" fill="#3A1236" stroke="#7A2A6E"/>
    <text x="76" y="204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E5B8E8">2</text>
    <text x="102" y="194" font-size="15" font-weight="700" fill="#E8ECF3">定位可复用定义</text>
    <text x="102" y="214" font-size="12.5" fill="#98A2B3">原任务 · 现有角色 · 模板 · 插件——先检索，再选最小变更类型</text>

    <!-- 3 -->
    <rect x="40" y="244" width="620" height="54" rx="10" fill="#171C26" stroke="#2C3542"/>
    <rect x="40" y="244" width="4" height="54" rx="2" fill="#920783"/>
    <circle cx="76" cy="271" r="14" fill="#3A1236" stroke="#7A2A6E"/>
    <text x="76" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E5B8E8">3</text>
    <text x="102" y="266" font-size="15" font-weight="700" fill="#E8ECF3">形成增量 ChangeProposal</text>
    <text x="102" y="286" font-size="12.5" fill="#98A2B3">base_workflow_version/digest · patch · 权限预算增量 · 受影响消费者 · 回退点</text>

    <!-- 4 -->
    <rect x="40" y="316" width="620" height="54" rx="10" fill="#171C26" stroke="#2C3542"/>
    <rect x="40" y="316" width="4" height="54" rx="2" fill="#920783"/>
    <circle cx="76" cy="343" r="14" fill="#3A1236" stroke="#7A2A6E"/>
    <text x="76" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E5B8E8">4</text>
    <text x="102" y="338" font-size="15" font-weight="700" fill="#E8ECF3">预览影响</text>
    <text x="102" y="358" font-size="12.5" fill="#98A2B3">立即可执行的 · 等待的前置 · 在途任务保持什么 · 哪个后继动作会改变</text>

    <!-- 5 校验 -->
    <rect x="40" y="388" width="620" height="54" rx="10" fill="#171C26" stroke="#2C3542"/>
    <rect x="40" y="388" width="4" height="54" rx="2" fill="#5B9BD5"/>
    <circle cx="76" cy="415" r="14" fill="#12233A" stroke="#2E5480"/>
    <text x="76" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9FC6EA">5</text>
    <text x="102" y="410" font-size="15" font-weight="700" fill="#E8ECF3">确定性校验</text>
    <text x="102" y="430" font-size="12.5" fill="#98A2B3">重复 ID · 缺失引用 · 循环依赖 · 不可达必需节点 · 兼容 · 能力 · 独立性 · 版本 · 权限 · 预算</text>

    <!-- gate ① -->
    <rect x="40" y="460" width="620" height="68" rx="10" fill="#1E1A16" stroke="#5C4A2E"/>
    <rect x="40" y="460" width="4" height="68" rx="2" fill="#E0A83C"/>
    <circle cx="76" cy="494" r="14" fill="#2C2314" stroke="#5C4A2E"/>
    <text x="76" y="499" text-anchor="middle" font-size="12.5" font-weight="700" fill="#EFCB8A">①</text>
    <text x="102" y="486" font-size="15" font-weight="700" fill="#E0A83C">需要新权限 / 接收权变更 / 合同要求 owner 裁定？</text>
    <text x="102" y="507" font-size="12.5" fill="#B6C0CE">否 → 直接下行（跳过审批）　是 → 右侧原审批出口（可与②同时适用）</text>

    <!-- gate ② -->
    <rect x="40" y="620" width="620" height="68" rx="10" fill="#1E1A16" stroke="#5C4A2E"/>
    <rect x="40" y="620" width="4" height="68" rx="2" fill="#E0A83C"/>
    <circle cx="76" cy="654" r="14" fill="#2C2314" stroke="#5C4A2E"/>
    <text x="76" y="659" text-anchor="middle" font-size="12.5" font-weight="700" fill="#EFCB8A">②</text>
    <text x="102" y="646" font-size="15" font-weight="700" fill="#E0A83C">需要新 workflow 设计 / 改节点合同 / 完成判据？</text>
    <text x="102" y="667" font-size="12.5" fill="#B6C0CE">否 → 直接下行（跳过评审）　是 → 右侧 §8.5 多方评审</text>

    <!-- 6 apply -->
    <rect x="40" y="736" width="620" height="54" rx="10" fill="#171C26" stroke="#2C3542"/>
    <rect x="40" y="736" width="4" height="54" rx="2" fill="#5B9BD5"/>
    <circle cx="76" cy="763" r="14" fill="#12233A" stroke="#2E5480"/>
    <text x="76" y="768" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9FC6EA">6</text>
    <text x="102" y="758" font-size="15" font-weight="700" fill="#E8ECF3">按既有授权 apply</text>
    <text x="102" y="778" font-size="12.5" fill="#98A2B3">expected_revision 原子比较并交换；仅在校验通过且全部必要 gate 通过后执行</text>
  </g>

  <!-- 结果 -->
  <rect x="40" y="808" width="620" height="54" rx="10" fill="#12211F" stroke="#2E5C55"/>
  <text x="350" y="830" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14" font-weight="600" fill="#8FE0D4">Scheduler 在调度安全点接入</text>
  <text x="350" y="850" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#7FA9A2">STATUS 显示排队 · 握手 · 执行结果；applied 表示定义/入队生效，不等于需求已实现</text>

  <!-- 主链箭头 -->
  <g stroke="#6B7A90" stroke-width="1.8" fill="none" marker-end="url(#arw3)">
    <path d="M76 154 V172"/>
    <path d="M76 226 V244"/>
    <path d="M76 298 V316"/>
    <path d="M76 370 V388"/>
    <path d="M76 442 V460"/>
    <path d="M76 528 V620"/>
    <path d="M76 688 V736"/>
    <path d="M76 790 V808"/>
  </g>
  <text x="88" y="576" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#8A7A5E">否 · 跳过</text>
  <text x="88" y="714" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#8A7A5E">否 · 跳过</text>

  <!-- 右侧：gate 处理与出口 -->
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
    <rect x="700" y="388" width="540" height="54" rx="10" fill="#1E1418" stroke="#6E2A33"/>
    <text x="720" y="410" font-size="14.5" font-weight="700" fill="#E05A6B">校验失败</text>
    <text x="720" y="429" font-size="12.5" fill="#8A5A62">rejected（具名原因，不沿成功线进入 apply）</text>

    <rect x="700" y="460" width="540" height="68" rx="10" fill="#1E1A16" stroke="#5C4A2E"/>
    <text x="720" y="484" font-size="14.5" font-weight="700" fill="#E0A83C">owner 审批（原审批出口）</text>
    <text x="720" y="504" font-size="12.5" fill="#B6C0CE">等待 owner 明确裁定；无回复 ≠ 同意</text>
    <text x="720" y="521" font-size="12" fill="#8A7A5E">LLM 不得替用户批准</text>

    <rect x="760" y="544" width="480" height="56" rx="10" fill="#1E1418" stroke="#6E2A33"/>
    <text x="780" y="566" font-size="14" font-weight="700" fill="#E05A6B">拒绝 / 未批准</text>
    <text x="780" y="584" font-size="12.5" fill="#8A5A62">blocked · awaiting_owner（不进入 apply）</text>

    <rect x="700" y="620" width="540" height="68" rx="10" fill="#1E1A16" stroke="#5C4A2E"/>
    <text x="720" y="644" font-size="14.5" font-weight="700" fill="#E0A83C">§8.5 多方评审</text>
    <text x="720" y="664" font-size="12.5" fill="#B6C0CE">≥2 个独立评审身份（作者不计票）· 所有必需槽位通过</text>
    <text x="720" y="681" font-size="12" fill="#8A7A5E">无未解决 blocking · 校验通过 · 具权限集成者接收</text>

    <rect x="760" y="704" width="480" height="56" rx="10" fill="#1E1418" stroke="#6E2A33"/>
    <text x="780" y="726" font-size="14" font-weight="700" fill="#E05A6B">必需槽位未全通过 / 有 blocking</text>
    <text x="780" y="744" font-size="12.5" fill="#8A5A62">awaiting_review（不进入 apply）</text>
  </g>

  <!-- 分支箭头 -->
  <g stroke-width="1.6" fill="none">
    <path d="M660 415 H700" stroke="#E05A6B" marker-end="url(#arw3r)"/>
    <path d="M660 494 H700" stroke="#E0A83C" marker-end="url(#arw3a)"/>
    <path d="M660 654 H700" stroke="#E0A83C" marker-end="url(#arw3a)"/>
    <path d="M970 528 V544" stroke="#E05A6B" marker-end="url(#arw3r)"/>
    <path d="M970 688 V704" stroke="#E05A6B" marker-end="url(#arw3r)"/>
    <path d="M740 528 V600 H150 V620" stroke="#4CB782" marker-end="url(#arw3g)"/>
    <path d="M740 688 V730 H150 V736" stroke="#4CB782" marker-end="url(#arw3g)"/>
  </g>

  <!-- 分支标签 -->
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#B6C0CE">
    <text x="680" y="410" text-anchor="middle">校验失败</text>
    <text x="680" y="489" text-anchor="middle">是</text>
    <text x="680" y="649" text-anchor="middle">是</text>
    <text x="985" y="536">拒绝</text>
    <text x="985" y="696">未通过</text>
    <text x="700" y="596" fill="#4CB782">批准</text>
    <text x="700" y="726" fill="#4CB782">通过</text>
  </g>

  <!-- 底部说明 -->
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#98A2B3">
    <text x="40" y="880">intake / planner 角色的边界：只提出建议，不持调度写权、不自行扩大权限；</text>
    <text x="40" y="898">自然语言解析不是授权，结构化输入也不等于批准。</text>
  </g>
</svg>
